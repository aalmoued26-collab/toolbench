# Toolbench — Netlify config (Git-based deploy)
# Netlify builds from the repo, bundles the functions in netlify/functions,
# and publishes the repo root as the site.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pretty API paths: /api/character -> the function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
