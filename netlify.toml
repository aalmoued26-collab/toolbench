# Toolbench — Netlify config (safe for drag-and-drop deploys)
# No [build] section: on a manual deploy the dropped folder/zip IS the site root,
# so we must NOT set a publish path (that can cause a root 404). Netlify
# auto-detects the netlify/functions folder and bundles it.

[functions]
  node_bundler = "esbuild"

# Pretty API paths: /api/character -> the function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
