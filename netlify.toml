# Toolbench — Netlify config (Git-based deploy)
# Functions live in the top-level "functions" folder (clean, no duplicates).
# The old netlify/functions folder is intentionally NOT used, so any stray or
# badly-named leftover files there are ignored and cannot break the build.

[build]
  publish = "."
  functions = "functions"

[functions]
  node_bundler = "esbuild"

# Pretty API paths: /api/character -> the function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
